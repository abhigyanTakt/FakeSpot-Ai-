<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Review Detector - Analyze Reviews</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.62/build/spline-viewer.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --dark: #000000;
            --light: #f8fafc;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark);
            color: var(--light);
            overflow-x: hidden;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: white;
        }

        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding-top: 100px;
        }

        .detector-section {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 1.5rem;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
            position: relative;
        }

        h1::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: linear-gradient(to right, #6366f1, #a855f7);
            margin: 1rem auto 0;
        }

        .subtitle {
            text-align: center;
            color: #d0d0d0;
            font-size: 1.1rem;
            margin-bottom: 3rem;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .input-area {
            background: var(--glass);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            transition: var(--transition);
        }

        .input-area:hover {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .input-area h3 {
            color: var(--secondary);
            margin-bottom: 1rem;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            color: var(--light);
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            resize: vertical;
            transition: var(--transition);
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        textarea::placeholder {
            color: #64748b;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: 0.6s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-analyze {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: 2px solid #6366f1;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
        }

        .btn-analyze:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.5);
            background: linear-gradient(135deg, #7c7ff5 0%, #b974ff 100%);
        }

        .btn-analyze:active {
            transform: translateY(-1px);
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.95);
            color: #000000;
            border: 2px solid #ffffff;
            box-shadow: 0 8px 32px rgba(255, 255, 255, 0.1);
        }

        .btn-clear:hover {
            background: #ffffff;
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.3);
            transform: translateY(-3px);
        }

        .btn-clear:active {
            transform: translateY(-1px);
        }

        .results-area {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: var(--transition);
        }

        .results-area.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .result-item {
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            background: rgba(15, 23, 42, 0.5);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
        }

        .result-item.fake {
            border-left-color: #ef4444;
        }

        .result-item.genuine {
            border-left-color: #22c55e;
        }

        .result-label {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .badge-fake {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .badge-genuine {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .confidence {
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }

        .highlighted-words {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .highlighted-words h4 {
            color: var(--secondary);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .word-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .word-tag {
            background: var(--primary);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .word-tag.suspicious {
            background: #a855f7;
        }

        .loading {
            text-align: center;
            color: #94a3b8;
        }

        .loading::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border);
            color: #64748b;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .button-group { flex-direction: column; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">FakeSpot</a>
        <ul class="nav-links">
            <li><a href="index.html#home">Home</a></li>
            <li><a href="index.html#features">Features</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="detector-section">
            <h1>Review Detector</h1>
            <p class="subtitle">Paste a product review below to analyze its authenticity</p>

            <div class="input-area">
                <h3>Paste Your Review</h3>
                <textarea id="reviewText" placeholder="Paste the product review you want to analyze here..."></textarea>
                <div class="button-group">
                    <button class="btn btn-analyze" onclick="analyzeReview()">Analyze Review</button>
                    <button class="btn btn-clear" onclick="clearReview()">Clear</button>
                </div>
            </div>

            <div id="resultsArea" class="results-area"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 FakeSpot - Fake Review Detector. All rights reserved.</p>
    </footer>

    <script>
        // --- 3D BACKGROUND (using Spline) ---
        // No additional initialization needed - Spline handles it automatically

        // --- DETECTOR FUNCTIONS ---
        function analyzeReview() {
            const reviewText = document.getElementById('reviewText').value.trim();
            const resultsArea = document.getElementById('resultsArea');

            if (!reviewText) {
                alert('Please paste a review to analyze');
                return;
            }

            // Show loading state
            resultsArea.innerHTML = '<p class="loading">Analyzing Review</p>';
            resultsArea.classList.add('show');

            // Simulate API call with timeout
            setTimeout(() => {
                const result = generateMockAnalysis(reviewText);
                displayResults(result, resultsArea);
            }, 1500);
        }

        function generateMockAnalysis(text) {
            // Mock AI analysis logic
            const suspiciousWords = ['fake', 'never', 'best', 'worst', 'amazing', 'terrible'];
            const wordCount = text.split(' ').length;
            const charCount = text.length;
            
            // Simple heuristics for demo
            const hasExcessiveCaps = (text.match(/[A-Z]{3,}/g) || []).length > 2;
            const hasMultipleExclamations = (text.match(/!/g) || []).length > 3;
            const isSuspiciousLength = wordCount < 10 || wordCount > 500;
            
            const suspiciousCount = [hasExcessiveCaps, hasMultipleExclamations, isSuspiciousLength].filter(x => x).length;
            
            let isFake = suspiciousCount > 1;
            let confidence = Math.round((suspiciousCount / 3) * 100);
            
            if (!isFake) confidence = 100 - confidence;
            
            return {
                isFake: isFake,
                confidence: confidence,
                wordCount: wordCount,
                patterns: {
                    capsLock: hasExcessiveCaps,
                    exclamations: hasMultipleExclamations,
                    suspiciousLength: isSuspiciousLength
                }
            };
        }

        function displayResults(result, resultsArea) {
            const resultClass = result.isFake ? 'fake' : 'genuine';
            const resultText = result.isFake ? 'LIKELY FAKE' : 'LIKELY GENUINE';
            const badgeClass = result.isFake ? 'badge-fake' : 'badge-genuine';
            
            let html = `
                <div class="result-item ${resultClass}">
                    <div class="result-label">
                        <span class="badge ${badgeClass}">${resultText}</span>
                    </div>
                    <div class="confidence">Confidence: ${result.confidence}%</div>
                    <div class="highlighted-words">
                        <h4>Analysis Details:</h4>
                        <div class="word-tags">
                            <span class="word-tag ${result.patterns.capsLock ? 'suspicious' : ''}">
                                ${result.patterns.capsLock ? '⚠️ Excessive Caps' : '✓ Normal Caps'}
                            </span>
                            <span class="word-tag ${result.patterns.exclamations ? 'suspicious' : ''}">
                                ${result.patterns.exclamations ? '⚠️ Many Exclamations' : '✓ Balanced Punctuation'}
                            </span>
                            <span class="word-tag ${result.patterns.suspiciousLength ? 'suspicious' : ''}">
                                ${result.patterns.suspiciousLength ? '⚠️ Unusual Length' : '✓ Normal Length'} (${result.wordCount} words)
                            </span>
                        </div>
                    </div>
                </div>
            `;
            
            resultsArea.innerHTML = html;
        }

        function clearReview() {
            document.getElementById('reviewText').value = '';
            document.getElementById('resultsArea').classList.remove('show');
        }
    </script>
</body>
</html>
